# Production overrides, layered on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy is the only service published on the public interface (80/443, both
# allowed by the cloud firewall). The API and Postgres stay on the internal
# Docker network and are not published to the host at all.
#
# The migrate/api/worker image comes from GHCR, tagged by git SHA, so a deploy
# and a rollback are the same operation with a different tag. IMAGE_TAG is
# required: there is deliberately no `latest`. The repository path here must
# match the one deploy-backend.yml pushes to (ghcr.io/<owner>/<repo>); update
# both if the repo is ever renamed or transferred.
x-app-image: &app-image
  image: ghcr.io/jack93g/project-chinese-story-generator:${IMAGE_TAG:?IMAGE_TAG must be set to a git SHA}
  build: !reset null

services:

  db:
    ports: !reset []

  migrate:
    <<: *app-image

  api:
    <<: *app-image
    ports: !reset []

  worker:
    <<: *app-image

  # Pinned to the version proven on the Droplet. The Caddyfile's request_body
  # limit needs a recent Caddy 2.x, so avoid a floating tag.
  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
