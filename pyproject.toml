[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-story-generator"
version = "0.1.0"
description = "Backend for a personalised Chinese story generator"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.1,<2",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "respx>=0.22,<1",
]

[project.scripts]
sync-skritter = "story_generator.cli.ingestion:main"

[tool.setuptools.packages.find]
include = ["story_generator*"]
