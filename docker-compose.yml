# Docker's default log driver never rotates, and the API logs every request,
# so a flood of requests could fill the disk (and take Postgres down with it).
# The local driver keeps at most max-file x max-size per container.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# For the app containers (migrate, api, worker), which handle untrusted input
# and need no special privileges: drop every Linux capability, and stop any
# process in them from gaining more (e.g. via a setuid binary). Not applied to
# db, whose entrypoint needs root capabilities to set up its data directory.
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:

  db:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env} -d ${POSTGRES_DB:?POSTGRES_DB must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    <<: *hardening
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    <<: *hardening
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    <<: *hardening
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    command: python -m story_generator.cli.generation_worker
    # On SIGTERM the worker finishes its current request before exiting.
    # Longer than a provider call can take (~85s: 10s to connect, 75s for the
    # answer; see OpenAIStoryGenerationProvider), so a stop or deploy doesn't
    # kill a generation mid-call and leave it stuck "running".
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
