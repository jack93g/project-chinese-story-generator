name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run unit tests
        run: pytest -m "not db" -ra

      # The prod override (GHCR image by IMAGE_TAG, build removed) is only
      # otherwise exercised mid-deploy on the Droplet; render it here so a
      # mistake fails in CI. Dummy values: nothing is started.
      - name: Validate prod compose
        env:
          IMAGE_TAG: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: |
          # The base file's env_file needs a .env to exist; an empty one is
          # enough to render (gitignored, exists only on this runner).
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  python-db:
    name: Python DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Throwaway credentials for the ephemeral service container below; not a
      # secret. The test suite requires this to differ from DATABASE_URL (left
      # unset here) and to contain "test".
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/chinese_story_generator_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chinese_story_generator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d chinese_story_generator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Migrations are applied (and rolled back) by the apply_migrations
      # fixture in tests/conftest.py, same as running locally.
      - name: Run DB tests
        run: pytest -m db -v -ra

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
