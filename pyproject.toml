[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-story-generator"
version = "0.1.0"
description = "Backend for a personalised Chinese story generator"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.1,<2",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
sync-skritter = "story_generator.cli.ingestion:main"
manage-users = "story_generator.cli.users:main"
manage-lists = "story_generator.cli.lists:main"

[tool.setuptools.packages.find]
include = ["story_generator*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
# Line length is owned by `ruff format`; E501 would only flag long strings/URLs it can't wrap.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `param = Depends(...)` in signatures.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# env.py must call load_dotenv() before importing the models.
"alembic/env.py" = ["E402"]
