name: Deploy backend

# Builds the backend image tagged with the git SHA, pushes it to GHCR, then
# tells the Droplet to deploy that SHA. Running it by hand with a `sha` input
# skips the build and redeploys an already-published image, which is how a
# rollback works (see docs/droplet-setup.md).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character git SHA of an already-built image to deploy (rollback). Leave empty to build and deploy the selected ref."
        required: false
        type: string

permissions:
  contents: read

# One deploy at a time; a newer run queues behind an in-progress one rather
# than cancelling it mid-deploy.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push image
    # A rollback redeploys an existing image, so there is nothing to build.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA only, never `latest`, so every past image
      # stays addressable for a rollback.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the Droplet
    needs: build
    # Run after a successful build, or when the build was skipped (rollback).
    # Never after a failed build.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The deploy key is a secret of this Environment, which is restricted to
    # the main branch, so no other branch's workflow can read it.
    environment: production

    permissions:
      contents: read

    steps:
      - name: Resolve SHA to deploy
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Not a full 40-character git SHA: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_HOST_KEY: ${{ vars.DROPLET_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The Droplet's host key is pinned, so a deploy can never be sent
          # to (or leak the key to) an impostor host.
          printf '%s\n' "$DROPLET_HOST_KEY" > ~/.ssh/known_hosts

      # The key on the Droplet is locked to a forced command (see
      # docs/droplet-setup.md): the SHA below becomes that script's only
      # argument, and it can do nothing except deploy that image.
      - name: Deploy
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${DROPLET_HOST}" "$SHA"
