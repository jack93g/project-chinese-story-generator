name: OpenRouter PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openrouter-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't get repo secrets or a write-scoped GITHUB_TOKEN, so the
    # job can't authenticate to either API - skip rather than fail red.
    # Dependabot-triggered runs are also denied Actions secrets, and its PRs
    # are mechanical version bumps, so skip those too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Check out the base branch's SHA, never the PR's own code - the PR
      # diff is fetched separately over the API. Otherwise a same-repo (not
      # just fork) PR could edit this script to exfiltrate the secrets below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run DeepSeek review (via OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/openrouter_pr_review.py
